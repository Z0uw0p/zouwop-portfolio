name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify template catalog is in sync
        run: npm run sync:templates -- --check

      - name: Verify template demos are in sync
        run: npm run sync:demos -- --check

      - name: Prove the demo sync rejects a root-absolute asset URL
        run: npm run sync:demos -- --self-test

      - name: Type check
        run: npm run check

      - name: Build (writes sitemap.xml and checks SEO)
        run: npm run build

      - name: Prove the SEO check catches bad output
        run: npm run check:seo -- --self-test

      - name: Check internal links
        run: npm run check:links

      - name: Check licence parity
        run: npm run check:licence

      - name: Prove the link check catches a broken link
        run: npm run check:links -- --self-test
